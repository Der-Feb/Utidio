<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utidio — One plays, others pause</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>Utidio</h1>
      <p class="tagline">One plays. Others pause.</p>
      <p id="mode-label" class="mode-label">Auto-pause is on</p>
    </div>
    <label class="toggle">
      <span class="sr-only">Enable automatic pausing</span>
      <input type="checkbox" id="masterToggle" aria-label="Enable automatic pausing" checked>
      <span class="toggle-track" aria-hidden="true"></span>
    </label>
  </header>

  <main>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div class="tabs" role="tablist" aria-label="Audio manager views">
      <button id="media-tab" class="view-tab" type="button" role="tab" aria-selected="true" aria-controls="media-view">Media</button>
      <button id="listening-tab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="listening-view" tabindex="-1">Listening time</button>
    </div>
    <div id="media-view" role="tabpanel" aria-labelledby="media-tab">
      <section aria-labelledby="playing-heading">
        <h2 id="playing-heading">Playing</h2>
        <div id="playing-list" class="media-list"></div>
      </section>
      <section aria-labelledby="paused-heading">
        <h2 id="paused-heading">Paused</h2>
        <div id="paused-list" class="media-list"></div>
      </section>
    </div>
    <div id="listening-view" role="tabpanel" aria-labelledby="listening-tab" hidden>
      <h2>Daily listening time</h2>
      <div id="listening-list" class="listening-list" aria-live="polite"></div>
    </div>
  </main>
  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
