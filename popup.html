<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Audio Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>Tab Audio Sentinel</h1>
      <p id="mode-label" class="mode-label">Automatic pausing is on</p>
    </div>
    <label class="toggle">
      <span class="sr-only">Enable automatic pausing</span>
      <input type="checkbox" id="masterToggle" aria-label="Enable automatic pausing" checked>
      <span class="toggle-track" aria-hidden="true"></span>
    </label>
  </header>

  <main>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <section aria-labelledby="playing-heading">
      <h2 id="playing-heading">Playing</h2>
      <div id="playing-list" class="media-list"></div>
    </section>
    <section aria-labelledby="paused-heading">
      <h2 id="paused-heading">Paused</h2>
      <div id="paused-list" class="media-list"></div>
    </section>
  </main>
  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
